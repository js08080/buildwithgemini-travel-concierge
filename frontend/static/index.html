<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Concierge</title>
<!-- Google Fonts & Material Symbols -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root {
    --accent: #0d9488;
    --accent-gradient: linear-gradient(135deg, #0d9488 0%, #0284c7 100%);
    --user-bubble: linear-gradient(135deg, #0d9488 0%, #0369a1 100%);
    --bg: #f8fafc;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --text-primary: #1e293b;
    --text-secondary: #64748b;
    --shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
    --header-shadow: 0 3px 10px rgba(13, 148, 136, 0.15);
  }

  body.dark-mode {
    --accent: #14b8a6;
    --accent-gradient: linear-gradient(135deg, #0f766e 0%, #0284c7 100%);
    --user-bubble: linear-gradient(135deg, #0f766e 0%, #0369a1 100%);
    --bg: #0f172a;
    --card-bg: #1e293b;
    --border: #334155;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Outfit', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    height: 100vh;
    color: var(--text-primary);
    transition: background 0.25s ease, color 0.25s ease;
  }

  header {
    background: var(--accent-gradient);
    color: #fff;
    padding: 0.9rem 1.4rem;
    font-weight: 700;
    font-size: 1.25rem;
    letter-spacing: 0.3px;
    box-shadow: var(--header-shadow);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .header-brand { display: flex; align-items: center; gap: 0.5rem; }
  .header-actions { display: flex; gap: 0.5rem; align-items: center; }

  .icon-btn {
    background: rgba(255, 255, 255, 0.18);
    border: none;
    border-radius: 50%;
    width: 36px;
    height: 36px;
    color: #fff;
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease, transform 0.15s ease;
  }
  .icon-btn:hover { background: rgba(255, 255, 255, 0.3); transform: scale(1.05); }

  /* Category Shortcuts Bar */
  .category-bar {
    display: flex;
    gap: 0.5rem;
    padding: 0.6rem 1.2rem;
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    justify-content: center;
  }
  .cat-tab {
    font-family: inherit;
    font-size: 0.85rem;
    padding: 0.4rem 0.85rem;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    font-weight: 500;
    transition: all 0.18s ease;
  }
  .cat-tab.active, .cat-tab:hover {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.4rem;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
  }

  /* Welcome Hero Card (Empty State) */
  .welcome-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 1.8rem;
    text-align: center;
    box-shadow: var(--shadow);
    margin: auto 0;
    animation: fadeInUp 0.3s ease-out;
  }
  .welcome-title { font-size: 1.4rem; font-weight: 700; color: var(--text-primary); margin-bottom: 0.4rem; }
  .welcome-subtitle { font-size: 0.95rem; color: var(--text-secondary); margin-bottom: 1.2rem; }
  .features-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 0.75rem;
  }
  .feature-item {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0.8rem;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .feature-item:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: var(--shadow); }

  /* Message & Bubbles */
  .msg {
    display: flex;
    gap: 0.65rem;
    align-items: flex-end;
    animation: fadeInUp 0.22s ease-out forwards;
    max-width: 92%;
  }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.agent { align-self: flex-start; }

  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.05rem;
    background: #e0f2fe;
    color: #0284c7;
    flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  }
  .msg.user .avatar { background: #ccfbf1; color: #0f766e; }

  .bubble {
    padding: 0.85rem 1.15rem;
    border-radius: 18px 18px 18px 4px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    font-size: 0.96rem;
    line-height: 1.55;
    color: var(--text-primary);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .msg.user .bubble {
    border-radius: 18px 18px 4px 18px;
    background: var(--user-bubble);
    color: #ffffff;
    border: none;
    box-shadow: 0 4px 12px rgba(13,148,136,0.25);
  }
  .bubble.rich { background: transparent; border: none; padding: 0; box-shadow: none; max-width: 100%; white-space: normal; }

  /* Animated Typing Indicator */
  .typing-indicator {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 0.4rem 0.2rem;
  }
  .typing-indicator span {
    width: 7px;
    height: 7px;
    background: var(--accent);
    border-radius: 50%;
    animation: typing 1.4s infinite ease-in-out both;
  }
  .typing-indicator span:nth-child(1) { animation-delay: 0s; }
  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typing {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1.1); opacity: 1; }
  }

  .prompts-row {
    display: flex;
    gap: 0.6rem;
    padding: 0.75rem 1.2rem;
    background: var(--card-bg);
    overflow-x: auto;
    border-top: 1px solid var(--border);
    justify-content: center;
  }
  .prompt-pill {
    font-family: inherit;
    font-size: 0.85rem;
    padding: 0.5rem 0.95rem;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--bg);
    color: var(--text-primary);
    cursor: pointer;
    transition: all 0.18s ease;
    white-space: nowrap;
    font-weight: 500;
  }
  .prompt-pill:hover {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    transform: translateY(-1px);
    box-shadow: 0 3px 8px rgba(13,148,136,0.2);
  }

  form {
    display: flex;
    gap: 0.6rem;
    padding: 1rem 1.2rem;
    background: var(--card-bg);
    border-top: 1px solid var(--border);
  }
  input {
    flex: 1;
    padding: 0.8rem 1.1rem;
    border: 1px solid var(--border);
    border-radius: 24px;
    font-family: inherit;
    font-size: 0.98rem;
    outline: none;
    background: var(--bg);
    color: var(--text-primary);
    transition: border-color 0.15s ease;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(13,148,136,0.12); }
  button.send-btn {
    padding: 0.8rem 1.4rem;
    border: none;
    border-radius: 24px;
    background: var(--accent-gradient);
    color: #fff;
    font-family: inherit;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 3px 8px rgba(13,148,136,0.25);
  }
  button.send-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(13,148,136,0.35); }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Image Lightbox Modal */
  .lightbox {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(4px);
    align-items: center;
    justify-content: center;
  }
  .lightbox-content {
    max-width: 90%;
    max-height: 85vh;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .lightbox-close {
    position: absolute;
    top: 20px;
    right: 30px;
    color: #fff;
    font-size: 2.2rem;
    font-weight: bold;
    cursor: pointer;
  }

  /* --- A2UI component styles --- */
  .a2card { border: 1px solid var(--border); border-radius: 16px; padding: 1.2rem; background: var(--card-bg); box-shadow: var(--shadow); max-width: 100%; }
  .a2card + .a2card, .a2col > .a2card { margin-top: 0.75rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.7rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.45; color: var(--text-primary); }
  .a2text.a2-h1 { font-size: 1.5rem; font-weight: 700; color: var(--text-primary); }
  .a2text.a2-h2 { font-size: 1.25rem; font-weight: 700; color: var(--text-primary); }
  .a2text.a2-h3 { font-size: 1.1rem; font-weight: 600; color: var(--text-primary); }
  .a2text.a2-h4 { font-size: 1rem; font-weight: 600; color: var(--text-primary); }
  .a2text.a2-caption { font-size: 0.85rem; color: var(--text-secondary); }
  .a2divider { border: none; border-top: 1px solid var(--border); margin: 0.5rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 12px; display: block; box-shadow: 0 2px 8px rgba(0,0,0,0.08); cursor: pointer; transition: transform 0.2s ease; }
  .a2img:hover { transform: scale(1.02); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.25rem; line-height: 1; vertical-align: middle; color: var(--accent); }
</style>
</head>
<body>

<header>
  <div class="header-brand"><span>✈️</span> <span>Travel Concierge</span></div>
  <div class="header-actions">
    <button type="button" class="icon-btn" onclick="toggleDarkMode()" title="Toggle Dark/Light Mode" id="theme-btn">🌙</button>
    <button type="button" class="icon-btn" onclick="clearChat()" title="Clear Conversation">🗑️</button>
  </div>
</header>

<div class="category-bar">
  <button type="button" class="cat-tab active" onclick="filterCategory('all')">🌟 All Features</button>
  <button type="button" class="cat-tab" onclick="filterCategory('destinations')">🌍 Destinations</button>
  <button type="button" class="cat-tab" onclick="filterCategory('weather')">🌦️ Weather</button>
  <button type="button" class="cat-tab" onclick="filterCategory('budget')">💱 Budget & Rates</button>
  <button type="button" class="cat-tab" onclick="filterCategory('postcards')">🖼️ Scenic Postcards</button>
</div>

<div id="log">
  <div class="welcome-card" id="welcome-card">
    <div class="welcome-title">Welcome to Travel Concierge 🗺️</div>
    <div class="welcome-subtitle">Your AI-powered travel assistant for destinations, live weather, currency conversions, and AI scenic postcards.</div>
    <div class="features-grid">
      <div class="feature-item" onclick="sendPrompt('Find destinations in Japan and check Kyoto weather')">🌸 Explore Kyoto</div>
      <div class="feature-item" onclick="sendPrompt('Convert 500 USD to JPY for my trip budget')">💱 Budget Calculator</div>
      <div class="feature-item" onclick="sendPrompt('Generate a scenic postcard image for Amalfi Coast')">🖼️ Amalfi Postcard</div>
      <div class="feature-item" onclick="sendPrompt('What are some top places to visit in Paris?')">🇫🇷 Explore Paris</div>
    </div>
  </div>
</div>

<div class="prompts-row" id="prompts-container">
  <button type="button" class="prompt-pill" data-cat="destinations" onclick="sendPrompt('Find destinations in Japan and check Kyoto weather')">🌸 Kyoto Weather & Spots</button>
  <button type="button" class="prompt-pill" data-cat="budget" onclick="sendPrompt('Convert 500 USD to JPY for my trip budget')">💱 Convert $500 USD to JPY</button>
  <button type="button" class="prompt-pill" data-cat="postcards" onclick="sendPrompt('Generate a scenic postcard image for Amalfi Coast')">🖼️ Amalfi Coast Postcard</button>
</div>

<form id="form" style="border-top:none;">
  <input id="input" placeholder="Ask your Travel Concierge anything..." autocomplete="off" autofocus>
  <button class="send-btn">Send</button>
</form>

<!-- Lightbox Modal -->
<div id="lightbox" class="lightbox" onclick="closeLightbox()">
  <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
  <img id="lightbox-img" class="lightbox-content" src="" alt="Enlarged Preview">
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const welcomeCard = document.getElementById("welcome-card");

function toggleDarkMode() {
  document.body.classList.toggle("dark-mode");
  const isDark = document.body.classList.contains("dark-mode");
  document.getElementById("theme-btn").textContent = isDark ? "☀️" : "🌙";
}

function clearChat() {
  log.innerHTML = "";
  if (welcomeCard) log.appendChild(welcomeCard);
}

function filterCategory(cat) {
  document.querySelectorAll(".cat-tab").forEach(t => t.classList.remove("active"));
  event.target.classList.add("active");
  const pills = document.querySelectorAll(".prompt-pill");
  pills.forEach(p => {
    if (cat === "all" || p.getAttribute("data-cat") === cat) {
      p.style.display = "inline-block";
    } else {
      p.style.display = "none";
    }
  });
}

function openLightbox(url) {
  const lb = document.getElementById("lightbox");
  const img = document.getElementById("lightbox-img");
  img.src = url;
  lb.style.display = "flex";
}

function closeLightbox() {
  document.getElementById("lightbox").style.display = "none";
}

function sendPrompt(text) {
  input.value = text;
  form.dispatchEvent(new Event("submit", { cancelable: true }));
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  if (welcomeCard && welcomeCard.parentNode) {
    welcomeCard.parentNode.removeChild(welcomeCard);
  }
  const m = el("div", "msg " + who);
  const avatar = el("div", "avatar", who === "user" ? "👤" : "✈️");
  const b = el("div", "bubble");
  m.appendChild(avatar);
  m.appendChild(b);
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return b;
}

function showTypingIndicator(b) {
  b.innerHTML = `
    <div style="display:flex; align-items:center; gap:0.5rem;">
      <span style="font-size:0.88rem; color:var(--text-secondary);">Concierge is planning...</span>
      <div class="typing-indicator"><span></span><span></span><span></span></div>
    </div>
  `;
}

/* --- A2UI mini-renderer (v0.8 Basic Catalog subset) --- */
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img");
      img.src = src;
      img.alt = boundStr(props.alt) || "Travel Image";
      img.onclick = () => openLightbox(src);
      return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent");
  showTypingIndicator(b);
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
